<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kodiashop | Admin</title>

    <!-- PWA -->
    <link rel="manifest" href="/admin/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kodiashop Admin">
    <link rel="apple-touch-icon" href="/admin/icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { kodiBlue: '#2563eb', kodiDark: '#050505' },
                    fontFamily: { bebas: ['"Bebas Neue"', 'sans-serif'], jakarta: ['"Plus Jakarta Sans"', 'sans-serif'], mono: ['"Space Mono"', 'monospace'] },
                    animation: { 'slideUp': 'slideUp 0.3s ease-out' },
                    keyframes: { slideUp: { '0%': { transform: 'translateY(20px)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } } }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

            projectId: "kodiashop-5f927",

    <style>
        body { background-color: #000; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; }
        .brutalist-input { width: 100%; background: #0d0d0d; border: 1px solid #2a2a2a; color: white; padding: 0.65rem 0.85rem; font-size: 0.82rem; margin-top: 0.25rem; outline: none; transition: border-color 0.2s, background 0.2s; font-family: 'Plus Jakarta Sans', sans-serif; border-radius: 10px; }
        .brutalist-input:focus { border-color: #2563eb; background: #111; }
        .brutalist-btn { background: #2563eb; color: black; padding: 0.65rem 1.5rem; font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; cursor: pointer; text-transform: uppercase; border: 2px solid #2563eb; transition: all 0.2s; letter-spacing: 0.05em; border-radius: 10px; }
        .brutalist-btn:hover { background: #000; color: #2563eb; box-shadow: 3px 3px 0px 0px #2563eb; }
        .brutalist-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
        .brutalist-btn-outline { background: #000; color: #fff; border: 1px solid #2a2a2a; transition: all 0.2s ease; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.75rem; font-weight: 600; border-radius: 8px; }
        .brutalist-btn-outline:hover, .brutalist-btn-outline.active { border-color: #2563eb; color: #2563eb; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #000; } ::-webkit-scrollbar-thumb { background: #333; } ::-webkit-scrollbar-thumb:hover { background: #2563eb; }

        /* Responsive sidebar / bottom nav */
        .admin-sidebar { display: none; flex-direction: column; width: 13rem; background: #000; border-right: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
        .admin-bottom-nav {
            display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 400;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255,255,255,0.07);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        /* !important prevents Tailwind CDN (injected after this block) from
           overriding padding-bottom via p-4's shorthand at same specificity. */
        .admin-main-padding { padding-bottom: max(7rem, calc(4.5rem + env(safe-area-inset-bottom, 0px))) !important; }
        .admin-saving-offset { bottom: 7rem; }
        @media (min-width: 768px) {
            .admin-sidebar { display: flex; }
            .admin-bottom-nav { display: none; }
            .admin-main-padding { padding-bottom: 2rem !important; }
            .admin-saving-offset { bottom: 1.5rem; }
        }

        /* Form slide-up sheet — z-index above nav so content is never clipped */
        .form-sheet {
            position: fixed; inset: 0; z-index: 500; background: #0a0a0a;
            overflow-y: auto; transform: translateY(100%);
            transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
            border-radius: 24px 24px 0 0;
        }
        .form-sheet.is-open { transform: translateY(0); }

        /* Desktop form sidebar (hidden on mobile) */
        .desk-form { display: none; border-radius: 16px; overflow: hidden; }

        /* Floating action button (mobile only) */
        .fab {
            position: fixed; bottom: 6rem; right: 1.25rem; z-index: 450;
            width: 54px; height: 54px; background: #2563eb; color: #000;
            border-radius: 50%; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 900;
            box-shadow: 0 4px 24px rgba(37,99,235,0.5), 0 1px 4px rgba(0,0,0,0.6);
            transition: transform 0.15s, box-shadow 0.15s; touch-action: manipulation;
        }
        .fab:active { transform: scale(0.91); box-shadow: 0 2px 12px rgba(37,99,235,0.4); }

        /* Orders: cards on mobile, table on desktop */
        .order-cards { display: flex; flex-direction: column; gap: 0.5rem; }
        .order-table-wrap { display: none; }

        /* View slide-in animation */
        @keyframes fadeSlideIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
        .view-animate { animation: fadeSlideIn 0.22s ease-out; }

        /* Analytics KPI grid: 4 cols on desktop */
        .kpi-grid { grid-template-columns: repeat(2, 1fr); }

        /* Hidden in sheet: desktop-only inner header (hidden on mobile, visible on desktop inside desk-form) */
        .form-sheet .hidden-in-sheet { display: none; }
        .desk-form .form-sheet-header { display: none; }

        @media (min-width: 768px) {
            .form-sheet { display: none !important; }
            .desk-form { display: flex; flex-direction: column; width: 33.333%; min-width: 280px; max-width: 380px; flex-shrink: 0; }
            .fab { display: none; }
            .order-cards { display: none; }
            .order-table-wrap { display: block; overflow-x: auto; }
            .kpi-grid { grid-template-columns: repeat(4, 1fr) !important; }
            .desk-form .hidden-in-sheet { display: block; }
        }

        /* ============================================================
           KODIASHOP ADMIN — VISUAL REFRESH
           Shopify-inspired admin UI. Presentation only; no app logic.
           ============================================================ */
        :root {
            color-scheme: light;
            --ks-page: #f6f6f7;
            --ks-surface: #ffffff;
            --ks-surface-subtle: #fafafa;
            --ks-text: #202223;
            --ks-muted: #616a70;
            --ks-border: #e1e3e5;
            --ks-border-strong: #c9cccf;
            --ks-brand: #2563eb;
            --ks-brand-hover: #1d4ed8;
            --ks-shadow-card: 0 1px 2px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.04);
            --ks-radius: 12px;
            --ks-radius-sm: 8px;
            --ks-focus: 0 0 0 3px rgba(37,99,235,.18);
        }

        html { background: var(--ks-page); }
        body {
            background: var(--ks-page) !important;
            color: var(--ks-text) !important;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
            font-size: 14px;
            line-height: 1.5;
            letter-spacing: -.01em;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        #root { min-height: 100vh; }
        button, input, select, textarea { font: inherit; }
        button { -webkit-tap-highlight-color: transparent; }
        ::selection { background: rgba(37,99,235,.16); }
        :focus-visible { outline: none; box-shadow: var(--ks-focus); }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            color: var(--ks-text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
            font-weight: 650;
            letter-spacing: -.035em;
            line-height: 1.22;
        }
        h1 { font-size: clamp(1.45rem, 2vw, 1.9rem); }
        h2 { font-size: 1.25rem; }
        h3 { font-size: 1.02rem; }
        p, label, small { letter-spacing: -.01em; }
        .font-bebas, [class*="font-bebas"] {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
            font-weight: 700 !important;
            letter-spacing: -.025em !important;
        }

        /* Main application surfaces and navigation */
        .admin-sidebar {
            width: 252px !important;
            background: #fff !important;
            color: var(--ks-text) !important;
            border-right: 1px solid var(--ks-border) !important;
            padding: 18px 12px;
        }
        .admin-sidebar a, .admin-sidebar button,
        .admin-bottom-nav a, .admin-bottom-nav button {
            border-radius: 8px;
            transition: background .16s ease, color .16s ease, border-color .16s ease;
        }
        .admin-sidebar a:hover, .admin-sidebar button:hover {
            background: #f1f2f3 !important;
        }
        .admin-sidebar .active, .admin-sidebar [aria-current="page"] {
            background: #eef3ff !important;
            color: #1746a2 !important;
            font-weight: 650;
        }
        .admin-bottom-nav {
            background: rgba(255,255,255,.96) !important;
            border-top: 1px solid var(--ks-border) !important;
            box-shadow: 0 -5px 20px rgba(0,0,0,.045);
            color: var(--ks-text) !important;
        }
        .admin-main-padding { color: var(--ks-text); }

        /* Common card / panel patterns (including Tailwind utility surfaces) */
        .bg-black, .bg-\[\#000\], .bg-\[\#050505\], .bg-\[\#0a0a0a\],
        .bg-\[\#0d0d0d\], .bg-\[\#111\] {
            background-color: var(--ks-surface) !important;
        }
        .border-white\/5, .border-white\/10, .border-white\/\[0\.06\],
        .border-\[\#222\], .border-\[\#2a2a2a\], .border-\[\#333\] {
            border-color: var(--ks-border) !important;
        }
        .rounded-xl, .rounded-2xl, .rounded-\[16px\], .rounded-\[20px\] {
            border-radius: var(--ks-radius) !important;
        }
        .shadow, .shadow-lg, .shadow-xl { box-shadow: var(--ks-shadow-card) !important; }

        /* Improve contrast where the old dark palette was used */
        .text-white, .text-gray-100, .text-gray-200, .text-gray-300,
        .text-\[\#fff\], .text-\[white\] { color: var(--ks-text) !important; }
        .text-gray-400, .text-gray-500, .text-\[\#888\], .text-\[\#999\] {
            color: var(--ks-muted) !important;
        }
        .text-black { color: #fff !important; }

        /* Inputs */
        .brutalist-input,
        input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
        select, textarea {
            min-height: 40px;
            background: #fff !important;
            color: var(--ks-text) !important;
            border: 1px solid var(--ks-border-strong) !important;
            border-radius: var(--ks-radius-sm) !important;
            padding: 9px 12px;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
            font-size: 13px;
            box-shadow: 0 1px 0 rgba(0,0,0,.02);
            transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
        }
        input::placeholder, textarea::placeholder { color: #8c9196 !important; opacity: 1; }
        .brutalist-input:focus, input:focus, select:focus, textarea:focus {
            border-color: var(--ks-brand) !important;
            background: #fff !important;
            box-shadow: var(--ks-focus) !important;
            outline: none !important;
        }
        input[type="checkbox"], input[type="radio"] { accent-color: var(--ks-brand); }
        input[type="file"] { max-width: 100%; font-size: 12px; }

        /* Buttons */
        .brutalist-btn, button.brutalist-btn {
            min-height: 40px;
            background: var(--ks-brand) !important;
            color: #fff !important;
            border: 1px solid var(--ks-brand) !important;
            border-radius: 8px !important;
            padding: 9px 16px;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
            font-size: 13px !important;
            font-weight: 650 !important;
            letter-spacing: 0 !important;
            text-transform: none !important;
            box-shadow: 0 1px 1px rgba(0,0,0,.08);
            transition: background .16s ease, box-shadow .16s ease, transform .16s ease;
        }
        .brutalist-btn:hover {
            background: var(--ks-brand-hover) !important;
            color: #fff !important;
            box-shadow: 0 2px 5px rgba(37,99,235,.2) !important;
            transform: translateY(-1px);
        }
        .brutalist-btn-outline {
            min-height: 36px;
            background: #fff !important;
            color: var(--ks-text) !important;
            border: 1px solid var(--ks-border-strong) !important;
            border-radius: 8px !important;
            padding: 7px 12px;
            font-size: 12px !important;
            font-weight: 600 !important;
        }
        .brutalist-btn-outline:hover, .brutalist-btn-outline.active {
            background: #f4f7ff !important;
            border-color: #9bb8f5 !important;
            color: #1746a2 !important;
        }
        button:disabled, .brutalist-btn:disabled { opacity: .48; cursor: not-allowed; transform: none; }

        /* Tables, lists and data rows */
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        thead th {
            background: #f6f6f7;
            color: #616a70 !important;
            font-size: 11px;
            font-weight: 650;
            letter-spacing: .035em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--ks-border);
            padding: 11px 14px;
            white-space: nowrap;
        }
        tbody td { color: var(--ks-text); padding: 13px 14px; border-bottom: 1px solid #eceeef; vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover { background: #fafbfc; }
        .order-table-wrap { border: 1px solid var(--ks-border); border-radius: var(--ks-radius); background: #fff; }
        .order-cards { gap: 10px !important; }
        .order-cards > * { border: 1px solid var(--ks-border); border-radius: var(--ks-radius); background: #fff; box-shadow: var(--ks-shadow-card); }

        /* Analytics and KPI cards */
        .kpi-grid { gap: 12px !important; }
        .kpi-grid > * {
            min-width: 0;
            background: #fff !important;
            border: 1px solid var(--ks-border) !important;
            border-radius: var(--ks-radius) !important;
            box-shadow: var(--ks-shadow-card);
            padding: 16px !important;
        }

        /* Forms, sheets and floating controls */
        .form-sheet {
            background: #f6f6f7 !important;
            color: var(--ks-text) !important;
            border: 1px solid var(--ks-border);
            box-shadow: 0 -12px 40px rgba(0,0,0,.14);
        }
        .desk-form {
            background: #fff !important;
            border: 1px solid var(--ks-border);
            border-radius: var(--ks-radius) !important;
            box-shadow: var(--ks-shadow-card);
        }
        .fab {
            background: var(--ks-brand) !important;
            color: #fff !important;
            box-shadow: 0 5px 18px rgba(37,99,235,.28) !important;
        }

        /* Status chips / badges */
        [class*="badge"], [class*="status"], [class*="tag"] {
            letter-spacing: 0;
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c9cccf; border: 2px solid var(--ks-page); border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #8c9196; }

        /* Motion and accessibility */
        .view-animate { animation: fadeSlideIn .18s ease-out; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
        @media (max-width: 767px) {
            body { font-size: 13px; }
            .admin-main-padding { padding-left: 14px !important; padding-right: 14px !important; }
            .form-sheet { padding-left: 16px; padding-right: 16px; }
            .kpi-grid { gap: 9px !important; }
            .kpi-grid > * { padding: 13px !important; }
            .admin-bottom-nav { min-height: 62px; }
        }
        @media (min-width: 768px) {
            .admin-sidebar { position: sticky; top: 0; height: 100vh; }
            .admin-main-padding { max-width: 1600px; }
        }

    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Admin scripts — fully pre-compiled with esbuild, no Babel Standalone needed. -->
    <script src="/dist/admin-views.js"></script>
    <script src="/dist/admin-panel.js"></script>


    <!-- Service Worker + PWA install -->
    <script>
        window.__pwaInstallPrompt = null;

        // Capture install prompt before Chrome dismisses it
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            window.__pwaInstallPrompt = e;
            // Notify React if already mounted
            if (window.__pwaReadyCallback) window.__pwaReadyCallback();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/admin/sw.js').then(reg => {
                    // When a new SW takes over reload to get fresh HTML
                    let refreshing = false;
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        if (!refreshing) { refreshing = true; window.location.reload(); }
                    });
                }).catch(err => console.error('SW error:', err));
            });
        }
    </script>
</body>
</html>
