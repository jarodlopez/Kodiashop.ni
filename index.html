    <style>
        /* ===== Tema claro tipo Shopify. Mismas clases/ids que usa el JS; solo cambia la apariencia. ===== */
        :root {
            --bg: #f1f1f1; --surface: #ffffff; --surface-2: #f6f6f7;
            --border: #e3e3e3; --border-strong: #c9cccf; --input-border: #8a8a8a;
            --text: #303030; --text-2: #616161; --text-3: #63676c;
            --primary: #303030; --primary-hover: #1a1a1a; --link: #005bd3; --focus: #005bd3;
            --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
            --shadow-card: 0 1px 0 rgba(26,26,26,.07), 0 0 0 1px rgba(26,26,26,.04);
            --shadow-pop: 0 8px 24px rgba(26,26,26,.18);
            --tap: 44px;
        }
        html { -webkit-text-size-adjust: 100%; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
               font-size: 14px; line-height: 1.45; overflow-x: hidden; touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
        img, video { max-width: 100%; }
        ::selection { background: rgba(0,91,211,.25); }

        /* --- Tipografía: Inter en todo; sin mayúsculas forzadas ni tracking exagerado --- */
        .font-bebas { font-weight: 650; letter-spacing: -0.01em; }
        .font-mono { font-variant-numeric: tabular-nums; }
        .tracking-widest { letter-spacing: .03em !important; }

        /* --- Controles --- */
        .brutalist-input { width: 100%; background: #fff; border: 1px solid var(--input-border); color: var(--text); padding: .6rem .8rem; font-size: .875rem; margin-top: .25rem; outline: none;
                           transition: border-color .15s, box-shadow .15s; font-family: inherit; border-radius: var(--radius-sm); }
        .brutalist-input:hover { border-color: #616161; }
        .brutalist-input:focus { border-color: var(--focus); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--focus); }
        .brutalist-input:disabled, select:disabled, textarea:disabled { background: var(--surface-2); opacity: .7; cursor: not-allowed; }
        .brutalist-input:user-invalid { border-color: #d72c0d; box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(215,44,13,.45); }
        ::placeholder { color: #63676c !important; opacity: 1; }
        select.brutalist-input option { background: #fff; color: var(--text); }

        .brutalist-btn { background: var(--primary); color: #fff; padding: .6rem 1.1rem; font-family: inherit; font-size: .875rem; font-weight: 600; cursor: pointer;
                         text-transform: none; border: 1px solid var(--primary); transition: background .15s, box-shadow .15s, transform .05s; letter-spacing: 0; border-radius: var(--radius-sm); box-shadow: inset 0 -1px 0 rgba(0,0,0,.35); }
        .brutalist-btn:hover { background: var(--primary-hover); color: #fff; box-shadow: inset 0 -1px 0 rgba(0,0,0,.45); }
        .brutalist-btn:active:not(:disabled) { transform: translateY(1px); }
        .brutalist-btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
        .brutalist-btn-outline { background: #fff; color: var(--text); border: 1px solid var(--border-strong); transition: background .15s, border-color .15s; font-family: inherit; font-size: .8125rem; font-weight: 600; border-radius: var(--radius-sm); box-shadow: 0 1px 0 rgba(26,26,26,.07); }
        .brutalist-btn-outline:hover { background: var(--surface-2); border-color: #8a8a8a; color: var(--text); }
        .brutalist-btn-outline.active { background: #ebebeb; border-color: var(--primary); color: var(--text); }
        button:disabled, button[disabled] { opacity: .5; cursor: not-allowed; }
        :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
        .brutalist-input:focus-visible { outline: none; }

        ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c9cccf; border-radius: 8px; } ::-webkit-scrollbar-thumb:hover { background: #8a8a8a; }

        /* --- Colores semánticos (acentos, estados, tarjetas) --- */
        .text-kodiBlue, .hover\:text-kodiBlue:hover, .group:hover .group-hover\:text-kodiBlue { color: var(--link) !important; }
        .bg-kodiBlue { color: #fff; }
        .bg-kodiBlue.text-black, .bg-kodiBlue .text-black { color: #fff !important; }
        .bg-amber-500.text-black { color: #4a2f00 !important; }
        .bg-\[\#25D366\] { color: #0b3d1e !important; }
        .bg-green-900 { background-color: #cdfee1 !important; }
        .hover\:bg-red-900:hover { background-color: #fed3d1 !important; color: #8e1f0b !important; }
        .rounded-full.bg-white { background-color: #fff !important; box-shadow: 0 1px 3px rgba(0,0,0,.35); }   /* perilla de interruptores */
        .bg-black\/90 { background-color: rgba(26,26,26,.55) !important; }                                       /* fondo de modales */
        .border-zinc-900 { border-color: #ebebeb !important; }
        .text-zinc-700 { color: #8a8a8a !important; }
        .h-screen.overflow-hidden.bg-zinc-950, .min-h-screen.bg-black { background-color: var(--bg) !important; }  /* fondo general gris; las tarjetas quedan blancas */
        .rounded-xl.bg-zinc-950, .rounded-xl.bg-black, .rounded-2xl.bg-zinc-950 { box-shadow: var(--shadow-card); border-color: var(--border) !important; }
        .shadow-2xl { box-shadow: var(--shadow-pop) !important; }

        /* --- Texto diminuto: mínimo legible --- */
        .text-\[8px\] { font-size: 10px !important; } .text-\[9px\] { font-size: 10.5px !important; }
        .text-\[10px\] { font-size: 11px !important; } .text-\[11px\] { font-size: 12px !important; }

        /* --- Responsive sidebar / bottom nav --- */
        .admin-sidebar { display: none; flex-direction: column; width: 13.5rem; background: #ebebeb; border-right: 1px solid var(--border); flex-shrink: 0; }
        .admin-bottom-nav {
            display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 400;
            background: rgba(255,255,255,.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .admin-main-padding { padding-bottom: max(7rem, calc(4.5rem + env(safe-area-inset-bottom, 0px))) !important; }
        .admin-saving-offset { bottom: 7rem; }
        @media (min-width: 768px) {
            .admin-sidebar { display: flex; }
            .admin-bottom-nav { display: none; }
            .admin-main-padding { padding-bottom: 2rem !important; }
            .admin-saving-offset { bottom: 1.5rem; }
        }

        /* --- Hoja de formulario (móvil) --- */
        .form-sheet {
            position: fixed; inset: 0; z-index: 500; background: var(--bg);
            overflow-y: auto; transform: translateY(100%); overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
            transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
            border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(26,26,26,.25);
        }
        .form-sheet.is-open { transform: translateY(0); }

        /* --- Formulario en escritorio (oculto en móvil) --- */
        .desk-form { display: none; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-card); }

        /* --- Botón flotante (solo móvil) --- */
        .fab {
            position: fixed; bottom: calc(6rem + env(safe-area-inset-bottom, 0px)); right: 1.25rem; z-index: 450;
            width: 56px; height: 56px; background: var(--primary); color: #fff;
            border-radius: 50%; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 700;
            box-shadow: 0 6px 20px rgba(26,26,26,.35), 0 1px 3px rgba(26,26,26,.4);
            transition: transform 0.15s, box-shadow 0.15s; touch-action: manipulation;
        }
        .fab:active { transform: scale(0.92); box-shadow: 0 3px 10px rgba(26,26,26,.35); }

        /* --- Pedidos: tarjetas en móvil, tabla en escritorio --- */
        .order-cards { display: flex; flex-direction: column; gap: 0.5rem; }
        .order-table-wrap { display: none; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }

        /* --- Animación de vistas --- */
        @keyframes fadeSlideIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
        .view-animate { animation: fadeSlideIn 0.22s ease-out; }

        /* --- KPIs --- */
        .kpi-grid { grid-template-columns: repeat(2, 1fr); }

        .form-sheet .hidden-in-sheet { display: none; }
        .desk-form .form-sheet-header { display: none; }

        @media (min-width: 768px) {
            .form-sheet { display: none !important; }
            .desk-form { display: flex; flex-direction: column; width: 33.333%; min-width: 280px; max-width: 380px; flex-shrink: 0; }
            .fab { display: none; }
            .order-cards { display: none; }
            .order-table-wrap { display: block; overflow-x: auto; }
            .kpi-grid { grid-template-columns: repeat(4, 1fr) !important; }
            .desk-form .hidden-in-sheet { display: block; }
        }

        /* --- Móvil: áreas táctiles >= 44px y sin zoom automático en iOS --- */
        @media (max-width: 767px) {
            .brutalist-input, input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="range"]), select, textarea { font-size: 16px !important; }
            .brutalist-input, input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="range"]), select { min-height: var(--tap); }
            button:not(.fab):not([class*="rounded-full"]):not([class^="h-"]):not([class*=" h-"]):not([class*=" w-4"]):not([class*=" w-5"]):not([class*=" w-6"]):not([class*=" w-8"]),
            summary, [role="button"] { min-height: var(--tap); }
            .admin-bottom-nav button, .admin-bottom-nav a { min-height: 56px; }
        }

        /* --- Movimiento reducido (los spinners de carga siguen girando) --- */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
            .animate-spin { animation-duration: 1.2s !important; animation-iteration-count: infinite !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Admin scripts — fully pre-compiled with esbuild, no Babel Standalone needed. -->
    <script src="/dist/admin-views.js"></script>
    <script src="/dist/admin-panel.js"></script>


    <!-- Service Worker + PWA install -->
    <script>
        window.__pwaInstallPrompt = null;

        // Capture install prompt before Chrome dismisses it
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            window.__pwaInstallPrompt = e;
            // Notify React if already mounted
            if (window.__pwaReadyCallback) window.__pwaReadyCallback();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/admin/sw.js').then(reg => {
                    // When a new SW takes over reload to get fresh HTML
                    let refreshing = false;
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        if (!refreshing) { refreshing = true; window.location.reload(); }
                    });
                }).catch(err => console.error('SW error:', err));
            });
        }
    </script>
</body>
