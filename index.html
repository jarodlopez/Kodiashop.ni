<style>
:root{
  --ink:#14203A; --ink2:#4A5775; --blue:#0B63F6; --blue-d:#0A4FC8; --sky:#E8F1FF;
  --mist:#F4F7FC; --line:#E3E9F4; --ok:#12A150; --bad:#D6372F; --paper:#fff;
  --r:14px; --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--paper);line-height:1.45;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* Header */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:23px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.brand img{height:36px;width:auto}
.brand b{color:var(--blue);font-weight:700}
.cartbtn{position:relative;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:15px}
.cartbtn span{min-width:20px;height:20px;border-radius:10px;background:var(--blue);font-size:12px;display:grid;place-items:center;padding:0 5px}

/* Banner pedido pendiente */
#pending{display:none;background:var(--sky);border-bottom:1px solid #cfe0ff}
#pending .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-top:10px;padding-bottom:10px;font-size:14px}
#pending button{background:var(--blue);color:#fff;border-radius:999px;padding:8px 14px;font-weight:600;white-space:nowrap}

/* Hero */
.hero{padding:28px 0 12px}
.hero .wrap{display:grid;gap:18px;align-items:center}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.04;letter-spacing:-.03em;font-weight:700;max-width:14ch}
.hero p{color:var(--ink2);margin-top:10px;max-width:46ch}
.hero .logo{display:none}
.search{margin-top:18px;display:flex;align-items:center;gap:10px;background:var(--mist);border:1px solid var(--line);border-radius:999px;padding:0 16px;height:48px;max-width:460px}
.search input{flex:1;border:0;background:none;outline:0;height:100%}
.search svg{flex:none;color:var(--ink2)}
@media(min-width:760px){.hero .wrap{grid-template-columns:1.2fr .8fr}.hero .logo{display:block;justify-self:center;width:min(300px,100%);height:auto}}

/* Categorías */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 6px;max-width:1180px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-weight:500;font-size:14px;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 12px;padding:14px 0 40px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:26px 18px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{text-align:left;display:block;width:100%;padding:0;align-self:start;font:inherit;color:inherit}
.card .ph{position:relative;aspect-ratio:4/5;border-radius:var(--r);background:var(--mist);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.card:hover .ph img{transform:scale(1.04)}
.tag{position:absolute;left:8px;top:8px;background:var(--blue);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.sold{position:absolute;inset:0;background:rgba(255,255,255,.72);display:grid;place-items:center;font-weight:700;color:var(--ink)}
.card h3{font-size:15px;font-weight:500;margin-top:9px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{display:flex;align-items:baseline;gap:8px;margin-top:3px;font-weight:700;font-size:17px}
.price s{font-weight:400;font-size:13px;color:var(--ink2)}
.state{padding:60px 16px;text-align:center;color:var(--ink2)}
.state button{margin-top:14px}
.skel{aspect-ratio:4/5;border-radius:var(--r);background:linear-gradient(90deg,var(--mist),#e9eff9,var(--mist));background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* Botones y formularios */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;font-weight:600;border-radius:12px;padding:14px 20px;width:100%}
.btn:hover{background:var(--blue-d)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.alt{background:var(--sky);color:var(--blue)}
.btn.ghost{background:none;color:var(--ink2);font-weight:500;padding:10px}
.btn.ok{background:#25D366;color:#073b1b}
.field{display:block;margin-top:12px}
.field span{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--paper)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);outline:0;box-shadow:0 0 0 3px rgba(11,99,246,.15)}
.err{margin-top:12px;background:#fdecea;color:var(--bad);padding:10px 12px;border-radius:10px;font-size:14px}
.note{margin-top:12px;background:var(--sky);color:var(--ink);padding:10px 12px;border-radius:10px;font-size:14px}

/* Diálogos */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);width:100%;max-width:100%;max-height:92dvh;margin:auto 0 0;border-radius:22px 22px 0 0;overflow:hidden;box-shadow:0 -10px 50px rgba(20,32,58,.25)}
dialog::backdrop{background:rgba(20,32,58,.5)}
dialog[open]{animation:up .22s ease-out;display:flex;flex-direction:column}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:18px;flex:none}
.x{width:38px;height:38px;border-radius:50%;background:var(--mist);display:grid;place-items:center;font-size:20px;line-height:1}
.db{overflow-y:auto;padding:16px 18px calc(18px + var(--safe));flex:1}
@media(min-width:760px){
  #dp{max-width:920px;margin:auto;border-radius:22px;max-height:88dvh}
  #dc{max-width:460px;margin:0 0 0 auto;height:100dvh;max-height:100dvh;border-radius:22px 0 0 22px}
  #dc[open]{animation:in .22s ease-out}
  @keyframes in{from{transform:translateX(30px);opacity:0}}
}

/* Producto */
.pd{display:grid;gap:18px}
@media(min-width:760px){.pd{grid-template-columns:1fr 1fr}}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;border-radius:var(--r);scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:100%;aspect-ratio:4/5;object-fit:cover;scroll-snap-align:center;background:var(--mist);border-radius:var(--r)}
.pd h2{font-size:24px;line-height:1.15;letter-spacing:-.02em}
.pd .price{font-size:26px;margin-top:8px}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.size{min-width:46px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);font-weight:600}
.size[aria-pressed=true]{border-color:var(--blue);background:var(--sky);color:var(--blue)}
.size:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.desc{margin-top:16px;color:var(--ink2);white-space:pre-line}
.lbl{font-weight:600;font-size:14px;margin-top:16px}

/* Carrito */
.row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row img{width:64px;height:80px;object-fit:cover;border-radius:10px;background:var(--mist)}
.row small{color:var(--ink2)}
.rm{color:var(--bad);font-size:13px;font-weight:500;padding:6px}
.tot{margin-top:14px;display:grid;gap:7px;font-size:15px}
.tot div{display:flex;justify-content:space-between}
.tot .big{font-size:20px;font-weight:700;padding-top:9px;border-top:1px solid var(--line)}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.zone{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.zone[aria-pressed=true]{border-color:var(--blue);background:var(--sky)}
.zone b{display:block;font-size:14px}.zone small{color:var(--ink2)}
.code{display:flex;gap:8px;margin-top:8px}
.code input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-transform:uppercase}
.code button{background:var(--ink);color:#fff;border-radius:12px;padding:0 16px;font-weight:600}
.ordno{font-size:30px;font-weight:700;letter-spacing:.04em;color:var(--blue);text-align:center}
.amount{margin-top:10px;background:var(--sky);border-radius:14px;padding:14px;text-align:center}
.amount b{font-size:28px;display:block}
.bank{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.bank img,.bank .bi{width:44px;height:44px;border-radius:10px;object-fit:contain;background:var(--mist);flex:none;display:grid;place-items:center;font-weight:700;color:var(--ink2)}
.bank div{flex:1;min-width:0}.bank small{color:var(--ink2);display:block}
.bank code{font-family:inherit;font-weight:600;font-size:16px;word-break:break-all}
.cp{background:var(--sky);color:var(--blue);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px}
.step-t{font-weight:700;margin-top:20px}
.done{text-align:center;padding:10px 0}
.done .ck{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:34px;margin:6px auto 14px}
#toast{width:max-content;max-width:calc(100vw - 32px);position:fixed;left:50%;bottom:calc(20px + var(--safe));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:100;display:flex;gap:12px;align-items:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast button{color:#9fc4ff;font-weight:600}
footer{background:var(--mist);border-top:1px solid var(--line);padding:26px 0 calc(26px + var(--safe));color:var(--ink2);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:space-between;align-items:center}
footer a{color:var(--ink);text-decoration:none;font-weight:500}
footer nav{display:flex;gap:18px;flex-wrap:wrap}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sh{font-size:22px;letter-spacing:-.02em;margin:28px 0 12px}
#promo{background:var(--blue);color:#fff;font-size:14px;font-weight:500}
#promo button{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;padding:10px 16px;color:#fff;text-align:center}
#promo b{background:rgba(255,255,255,.22);padding:2px 10px;border-radius:999px;letter-spacing:.04em}
/* Hero de novedades */
.hero2{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;margin-top:18px;border-radius:20px}
.hero2::-webkit-scrollbar{display:none}
.slide{flex:none;width:100%;scroll-snap-align:center;display:grid;background:linear-gradient(135deg,var(--ink) 0%,#0b2a6b 55%,var(--blue-d) 100%);color:#fff;border-radius:20px;overflow:hidden}
.slide .si{aspect-ratio:16/11;background:#0b2a6b}
.slide .si{position:relative;overflow:hidden}
.slide .si img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide .st{padding:20px 20px 24px;display:flex;flex-direction:column;justify-content:center;gap:10px;align-items:flex-start}
.slide .kick{background:#fff;color:var(--blue);font-weight:700;font-size:13px;padding:4px 12px;border-radius:999px}
.slide h2{font-size:clamp(26px,5vw,44px);line-height:1.05;letter-spacing:-.03em;max-width:16ch}
.slide .sp{font-size:22px;font-weight:700}.slide .sp s{font-weight:400;font-size:15px;opacity:.7;margin-left:8px}
.slide .btn{width:auto;background:#fff;color:var(--blue);padding:12px 22px}
.slide .btn:hover{background:var(--sky)}
@media(min-width:760px){.slide{grid-template-columns:1fr 1fr;height:clamp(340px,34vw,440px)}.slide .si{aspect-ratio:auto;order:2}.slide .st{padding:40px 44px}}
.dots{display:flex;justify-content:center;gap:8px;margin-top:12px}
.dots button{width:10px;height:10px;border-radius:5px;background:var(--line);padding:0;transition:width .2s,background .2s}
.dots button[aria-current=true]{background:var(--blue);width:24px}
/* Categorías */
.cats{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(132px,1fr);gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.cats::-webkit-scrollbar,.strip::-webkit-scrollbar{display:none}
@media(min-width:760px){.cats{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));overflow:visible}}
.tile{position:relative;aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:var(--sky);text-align:left;padding:0;display:block}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s}
.tile:hover img{transform:scale(1.05)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(20,32,58,.85))}
.tile span{position:absolute;left:12px;right:12px;bottom:10px;z-index:1;color:#fff;font-weight:600;line-height:1.15}
.tile small{display:block;font-weight:400;opacity:.85;font-size:12px;margin-top:2px}
/* Ofertas */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,170px);gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:none}
@media(min-width:760px){.strip{grid-auto-columns:minmax(200px,220px)}}
.strip .card{scroll-snap-align:start}
#catalogo{scroll-margin-top:70px}
#catalogo .search{margin-top:0}
.pimg img{width:100%;max-height:260px;object-fit:cover;border-radius:12px}
.ptitle{font-size:24px;letter-spacing:-.02em;line-height:1.1;margin-top:12px}
.flogo{width:92px;height:auto}
@media(min-width:760px){#dpop{max-width:460px;margin:auto;border-radius:22px;max-height:88dvh}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ============ CONFIGURACIÓN ============
   Estos valores los reemplaza configure.js en cada deploy de Vercel
   (usa las variables FIREBASE_PROJECT_ID, FIREBASE_WEB_API_KEY y WHATSAPP_NUMBER).
   No los edites a mano salvo que no uses configure.js. */
const FB = {
  apiKey: 'AIzaSyB6YA-gSckDvi-fdFlRsvwRttr3VnGQ82U',
  authDomain: 'kuranic-b1034.firebaseapp.com',
  projectId: 'kuranic-b1034'
};
const WA = '50587091008';
const IMGBB_KEY = 'B922654effe3a1ab5ac85cc4c23f97b8';
const SHIP = { managua: { label: 'Managua', cost: 100 }, departamentos: { label: 'Departamentos', cost: 165 } };
const K = { cart: 'kodia_cart', pend: 'kodia_pending_order', code: 'kodia_code', popup: 'kodia_popup' };

/* ============ DIAGNÓSTICO (solo con /?debug=1) ============ */
const dbg = (m) => {
  if (!/[?&]debug\b/.test(location.search)) return;
  let b = document.getElementById('dbg');
  if (!b) { b = document.createElement('pre'); b.id = 'dbg'; b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:999;background:#111;color:#9fc4ff;font:12px/1.4 monospace;padding:10px;margin:0;max-height:45vh;overflow:auto;white-space:pre-wrap'; document.body.appendChild(b); }
  b.textContent += m + '\n';
};
window.addEventListener('error', (e) => dbg('ERROR JS: ' + e.message));
window.addEventListener('unhandledrejection', (e) => dbg('PROMESA: ' + (e.reason?.code || e.reason?.message || e.reason)));

/* ============ UTILIDADES ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => 'C$ ' + Number(n || 0).toLocaleString('es-NI');
const jget = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const jset = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const jdel = (k) => { try { localStorage.removeItem(k); } catch {} };
const waLink = (t) => `https://wa.me/${WA}?text=${encodeURIComponent(t)}`;
// Las imágenes de ImgBB pasan por wsrv.nl (WebP + tamaño ajustado). Si falla, se usa la original.
const img = (u, w) => {
  if (!u || typeof u !== 'string' || !/^https?:\/\/i\.ibb\.co\//i.test(u)) return u || '';
  const b = w <= 600 ? 600 : 1200;
  return `https://wsrv.nl/?url=${encodeURIComponent(u.replace(/^https?:\/\//i, ''))}&w=${b}&output=webp&q=82&we&il`;
};
const imgTag = (u, w, alt, extra = '') =>
  `<img src="${esc(img(u, w))}" data-o="${esc(u)}" alt="${esc(alt)}" loading="lazy" decoding="async" ${extra}>`;
document.addEventListener('error', (e) => {
  const i = e.target;
  if (i.tagName === 'IMG' && i.dataset.o && i.dataset.f !== '1') { i.dataset.f = '1'; i.src = i.dataset.o; }
}, true);
const price = (p) => (p.discountPrice > 0 ? p.discountPrice : p.price);
const sizesOf = (p) => (Array.isArray(p.sizes) && p.sizes.length ? p.sizes : ['ÚNICA']);
const stockOf = (p, s) => { const v = p.stockBySizes?.[s]; return v === undefined || v === null || v === '' ? Infinity : Number(v); };
const isSold = (p) => sizesOf(p).every((s) => stockOf(p, s) <= 0);
const validCode = (c) => !!c && !!c.active && !(c.expiryDate && new Date(c.expiryDate) < new Date()) && !(c.usageLimit > 0 && (c.usageCount || 0) >= c.usageLimit);
const codeText = (c) => (c.type === 'percent' ? `${c.value}% de descuento` : `${fmt(c.value)} de descuento`);
const publicCodes = () => codes.filter((c) => validCode(c) && c.showOnHome !== false);
const syncLock = () => document.documentElement.classList.toggle('lock', ['dp', 'dc', 'dpop'].some((i) => $('#' + i).open));
const goCatalog = () => $('#catalogo').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
const disc = (p) => (p.discountPrice > 0 && p.price > p.discountPrice ? Math.round((1 - p.discountPrice / p.price) * 100) : 0);

let toastT;
function toast(msg, action) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ''}`;
  if (action) t.querySelector('button').onclick = () => { t.classList.remove('on'); action.fn(); };
  t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3200);
}

/* ============ ESTADO ============ */
let db, products = [], settings = {}, codes = [], banners = [], cat = 'ALL', query = '';
let cart = jget(K.cart, []);                 // [{ id, size }]
let pending = jget(K.pend, null);            // orden creada, pendiente de pago
const ui = { step: 'cart', zone: 'managua', code: '', applied: null, form: { name: '', phone: '', address: '' }, err: '', busy: false, file: null, ref: '', codeMsg: '' };

const saveCart = () => { jset(K.cart, cart); $('#count').textContent = cart.length; };
const byId = (id) => products.find((p) => p.id === id);
const lines = () => cart.map((c) => ({ ...c, p: byId(c.id) })).filter((l) => l.p);

function calc() {
  const subtotal = lines().reduce((a, l) => a + Number(price(l.p) || 0), 0);
  const a = ui.applied;
  const discount = a ? (a.type === 'percent' ? Math.round(subtotal * a.value / 100) : Math.min(a.value, subtotal)) : 0;
  const shipping = subtotal > 0 ? SHIP[ui.zone].cost : 0;
  return { subtotal, discount, shipping, total: subtotal - discount + shipping };
}

/* ============ CATÁLOGO ============ */
function cats() {
  const managed = settings.categories || [];
  const extra = [...new Set(products.map((p) => p.category).filter(Boolean))].filter((c) => !managed.includes(c));
  return ['ALL', ...managed.filter((c) => products.some((p) => p.category === c)), ...extra];
}
function renderChips() {
  const list = cats();
  $('#chips').style.display = list.length > 2 ? '' : 'none';
  $('#chips').innerHTML = list.map((c) => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c === cat}">${c === 'ALL' ? 'Todo' : esc(c)}</button>`).join('');
}
function cardHtml(p) {
  const d = disc(p), sold = isSold(p);
  return `<button class="card" data-open="${esc(p.id)}">
    <div class="ph">${imgTag(p.images?.[0], 600, p.title)}${d ? `<span class="tag">-${d}%</span>` : ''}${sold ? '<div class="sold">Agotado</div>' : ''}</div>
    <h3>${esc(p.title)}</h3>
    <div class="price">${fmt(price(p))}${d ? `<s>${fmt(p.price)}</s>` : ''}</div></button>`;
}
function renderGrid() {
  const q = query.trim().toLowerCase();
  const list = products.filter((p) => (cat === 'ALL' || p.category === cat) &&
    (!q || `${p.title} ${p.category || ''} ${p.sku || ''}`.toLowerCase().includes(q)));
  if (!list.length) {
    $('#grid').innerHTML = `<div class="state" style="grid-column:1/-1">${products.length ? 'No encontramos productos con esa búsqueda.' : 'Pronto tendremos productos nuevos.'}</div>`;
    return;
  }
  $('#grid').innerHTML = list.map(cardHtml).join('');
}


/* ============ PORTADA: NOVEDADES, CATEGORÍAS, OFERTAS, DESCUENTOS ============ */
const newest = () => products.filter((p) => !isSold(p) && p.images?.length)
  .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || ''))).slice(0, 5);

function renderHero() {
  const slides = [
    ...(settings.heroSlides || []).filter((x) => x.image).map((x) => ({ img: x.image, kick: x.subtitle || 'Destacado', title: x.title || '', cta: x.cta || 'Ver colección',
      attr: x.categoryTarget ? `data-cat="${esc(x.categoryTarget)}" data-go="catalogo"` : 'data-go="catalogo"' })),
    ...newest().map((p) => ({ img: p.images[0], kick: 'Novedad', title: p.title, price: price(p), old: disc(p) ? p.price : 0, cta: 'Ver producto', attr: `data-open="${esc(p.id)}"` })),
  ];
  const sec = $('#novedades'); sec.hidden = !slides.length; if (!slides.length) return;
  $('#hero').innerHTML = slides.map((x, i) => `<article class="slide" aria-label="${i + 1} de ${slides.length}">
    <div class="si">${imgTag(x.img, 1200, x.title)}</div>
    <div class="st"><span class="kick">${esc(x.kick)}</span><h2>${esc(x.title)}</h2>
    ${x.price ? `<div class="sp">${fmt(x.price)}${x.old ? `<s>${fmt(x.old)}</s>` : ''}</div>` : ''}
    <button class="btn" ${x.attr}>${esc(x.cta)}</button></div></article>`).join('');
  $('#hero img')?.setAttribute('loading', 'eager');
  $('#dots').innerHTML = slides.length > 1 ? slides.map((_, i) => `<button data-dot="${i}" aria-label="Ir a la diapositiva ${i + 1}" aria-current="${i === 0}"></button>`).join('') : '';
  startHero(slides.length);
}
let heroTimer;
function startHero(n) {
  clearInterval(heroTimer);
  const h = $('#hero'), step = () => h.clientWidth + 12, cur = () => Math.round(h.scrollLeft / step());
  h.scrollLeft = 0;
  if (n < 2) return;
  h.onscroll = () => requestAnimationFrame(() => document.querySelectorAll('#dots button').forEach((b, i) => b.setAttribute('aria-current', i === cur())));
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let paused = false;
  [['pointerenter', 1], ['focusin', 1], ['touchstart', 1], ['pointerleave', 0], ['focusout', 0], ['touchend', 0]].forEach(([ev, v]) => h.addEventListener(ev, () => { paused = !!v; }, { passive: true }));
  heroTimer = setInterval(() => { if (!paused && !document.hidden) h.scrollTo({ left: ((cur() + 1) % n) * step(), behavior: 'smooth' }); }, 5500);
}
function renderTiles() {
  const list = cats().filter((c) => c !== 'ALL'), sec = $('#catsec');
  sec.hidden = !list.length; if (!list.length) return;
  $('#cattiles').innerHTML = list.map((c) => {
    const items = products.filter((p) => p.category === c);
    const cover = settings.categoryCovers?.[c] || items.find((p) => p.images?.[0])?.images[0];
    return `<button class="tile" data-cat="${esc(c)}" data-go="catalogo">${cover ? imgTag(cover, 600, c) : ''}<span>${esc(c)}<small>${items.length} producto${items.length === 1 ? '' : 's'}</small></span></button>`;
  }).join('');
}
function renderOffers() {
  const list = products.filter((p) => disc(p) > 0 && !isSold(p)).sort((a, b) => disc(b) - disc(a)).slice(0, 10);
  $('#offers').hidden = !list.length; if (list.length) $('#offerstrip').innerHTML = list.map(cardHtml).join('');
}
function renderPromo() {
  const list = publicCodes(), bar = $('#promo'); bar.hidden = !list.length; if (!list.length) return;
  bar.innerHTML = list.length === 1
    ? `<button data-usecode="${esc(list[0].code)}">Usa el código <b>${esc(list[0].code)}</b> · ${esc(codeText(list[0]))}</button>`
    : `<button data-popup>Tienes <b>${list.length}</b> descuentos disponibles · Ver códigos</button>`;
}
function useCode(code) {
  const f = codes.find((x) => String(x.code).toUpperCase() === String(code).toUpperCase());
  if (!validCode(f)) { toast('Ese código ya no está disponible'); return false; }
  ui.applied = f; ui.code = f.code; ui.codeMsg = `Código ${f.code} aplicado.`; jset(K.code, f.code);
  toast(`Código ${f.code} aplicado a tu carrito`, { label: 'Ver carrito', fn: () => openCart('cart') });
  return true;
}
function restoreCode() {
  const saved = jget(K.code, null); if (!saved) return;
  const f = codes.find((x) => String(x.code).toUpperCase() === String(saved).toUpperCase());
  if (validCode(f)) { ui.applied = f; ui.code = f.code; ui.codeMsg = `Código ${f.code} aplicado.`; } else jdel(K.code);
}
function openPopup() {
  const list = publicCodes(), ban = banners[0], d = $('#dpop');
  d.innerHTML = `<div class="dh"><span>${list.length ? 'Descuentos para ti' : 'Novedades'}</span><button class="x" data-close="dpop" aria-label="Cerrar">×</button></div>
    <div class="db">${ban ? `<div class="pimg">${imgTag(ban.image, 1200, ban.title || 'Promoción')}</div>${ban.title ? `<h2 class="ptitle">${esc(ban.title)}</h2>` : ''}${ban.subtitle ? `<p class="desc" style="margin-top:6px">${esc(ban.subtitle)}</p>` : ''}` : ''}
    ${list.map((c) => `<div class="bank"><div><b style="font-size:20px;letter-spacing:.04em">${esc(c.code)}</b><small>${esc(codeText(c))}${c.expiryDate ? ' · hasta ' + esc(c.expiryDate) : ''}</small></div><button class="cp" data-usecode="${esc(c.code)}">Usar código</button></div>`).join('')}
    <button class="btn" style="margin-top:16px" data-close="dpop" data-go="catalogo">${esc(ban?.ctaText || 'Ver productos')}</button></div>`;
  if (!d.open) d.showModal(); syncLock();
}
function maybePopup() {
  let seen = null; try { seen = sessionStorage.getItem(K.popup); } catch {}
  if (seen || (!publicCodes().length && !banners.length) || $('#dp').open || $('#dc').open) return;
  try { sessionStorage.setItem(K.popup, '1'); } catch {}
  openPopup();
}
function renderAll() { renderPromo(); renderHero(); renderTiles(); renderOffers(); renderChips(); renderGrid(); }

/* ============ PRODUCTO ============ */
let pushed = false, pSize = null;
function openProduct(id, push = true) {
  const p = byId(id); if (!p) return;
  pSize = sizesOf(p).length === 1 ? sizesOf(p)[0] : null;
  paintProduct(p);
  const dlg = $('#dp'); if (!dlg.open) { dlg.showModal(); document.documentElement.classList.add('lock'); }
  document.title = `${p.title} | Kodiashop`;
  if (push && !location.pathname.startsWith('/producto/')) { history.pushState({ p: id }, '', '/producto/' + encodeURIComponent(id)); pushed = true; }
}
function paintProduct(p) {
  const d = disc(p), sold = isSold(p), sizes = sizesOf(p);
  const det = Array.isArray(p.details) ? p.details.join('\n') : (p.details || '');
  $('#dp').innerHTML = `
    <div class="dh"><span>Detalle</span><button class="x" data-close="dp" aria-label="Cerrar">×</button></div>
    <div class="db"><div class="pd">
      <div class="gal">${(p.images?.length ? p.images : ['']).map((u, i) => imgTag(u, 1200, `${p.title} ${i + 1}`)).join('')}</div>
      <div>
        <h2>${esc(p.title)}</h2>
        <div class="price">${fmt(price(p))}${d ? `<s>${fmt(p.price)}</s> <span class="tag" style="position:static">-${d}%</span>` : ''}</div>
        ${sizes.length > 1 || sizes[0] !== 'ÚNICA' ? `<div class="lbl">Elige una opción</div>
          <div class="sizes">${sizes.map((s) => `<button class="size" data-size="${esc(s)}" aria-pressed="${pSize === s}" ${stockOf(p, s) <= 0 ? 'disabled' : ''}>${esc(s)}</button>`).join('')}</div>` : ''}
        <div id="perr"></div>
        <button class="btn" style="margin-top:18px" data-add="${esc(p.id)}" ${sold ? 'disabled' : ''}>${sold ? 'Agotado' : 'Agregar al carrito'}</button>
        ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ''}
        ${det ? `<div class="lbl">Detalles</div><p class="desc" style="margin-top:6px">${esc(det)}</p>` : ''}
      </div></div></div>`;
}
function addToCart(id) {
  const p = byId(id); if (!p) return;
  if (!pSize) { $('#perr').innerHTML = '<div class="err">Elige una opción antes de agregar.</div>'; return; }
  const inCart = cart.filter((c) => c.id === id && c.size === pSize).length;
  if (inCart + 1 > stockOf(p, pSize)) { $('#perr').innerHTML = '<div class="err">Ya tienes todas las unidades disponibles en el carrito.</div>'; return; }
  cart.push({ id, size: pSize }); saveCart();
  toast('Agregado al carrito', { label: 'Ver carrito', fn: () => { closeDlg('dp'); openCart(); } });
  $('#perr').innerHTML = '';
}
function closeDlg(id) { const d = $('#' + id); if (d.open) d.close(); }
$('#dp').addEventListener('close', () => {
  syncLock();
  document.title = 'Kodiashop | Tecnología para tu día en Nicaragua';
  if (location.pathname.startsWith('/producto/') || new URLSearchParams(location.search).has('product')) {
    if (pushed) { pushed = false; history.back(); } else history.replaceState(null, '', '/');
  }
});
window.addEventListener('popstate', route);
function route() {
  const m = location.pathname.match(/^\/producto\/(.+)$/);
  const id = m ? decodeURIComponent(m[1]) : new URLSearchParams(location.search).get('product');
  if (id && byId(id)) openProduct(id, false); else if ($('#dp').open) { pushed = false; closeDlg('dp'); }
}

/* ============ CARRITO / CHECKOUT / PAGO ============ */
function openCart(step) {
  ui.step = step || (pending && !lines().length ? 'pay' : 'cart'); ui.err = '';
  paintCart();
  const d = $('#dc'); if (!d.open) d.showModal();
  document.documentElement.classList.add('lock');
}
const STEP_T = { cart: 'Tu carrito', data: 'Tus datos', pay: 'Pagar pedido', done: 'Pedido enviado' };

function summaryHtml(t) {
  return `<div class="tot">
    <div><span>Subtotal</span><span>${fmt(t.subtotal)}</span></div>
    ${t.discount ? `<div><span>Descuento${ui.applied ? ' ' + esc(ui.applied.code) : ''}</span><span>-${fmt(t.discount)}</span></div>` : ''}
    <div><span>Envío ${esc(SHIP[ui.zone].label)}</span><span>${fmt(t.shipping)}</span></div>
    <div class="big"><span>Total</span><span>${fmt(t.total)}</span></div></div>`;
}

function paintCart() {
  const d = $('#dc'), L = lines(), t = calc();
  let body = '';
  if (ui.step === 'cart') {
    if (!L.length) {
      body = `<div class="state">Tu carrito está vacío.<br><button class="btn alt" data-close="dc">Ver productos</button></div>`;
    } else {
      body = L.map((l, i) => `<div class="row">${imgTag(l.p.images?.[0], 600, l.p.title)}
        <div><div style="font-weight:600;line-height:1.2">${esc(l.p.title)}</div><small>${l.size === 'ÚNICA' ? '' : esc(l.size) + ' · '}${fmt(price(l.p))}</small></div>
        <button class="rm" data-rm="${i}">Quitar</button></div>`).join('') + `
        <div class="lbl">Zona de envío</div>
        <div class="zones">${Object.entries(SHIP).map(([k, v]) => `<button class="zone" data-zone="${k}" aria-pressed="${ui.zone === k}"><b>${v.label}</b><small>${fmt(v.cost)}</small></button>`).join('')}</div>
        <div class="lbl">Código de descuento</div>
        <div class="code"><input id="codeIn" value="${esc(ui.code)}" placeholder="Opcional" autocomplete="off"><button data-code>Aplicar</button></div>
        ${ui.codeMsg ? `<div class="${ui.applied ? 'note' : 'err'}">${esc(ui.codeMsg)}</div>` : ''}
        ${summaryHtml(t)}
        <button class="btn" style="margin-top:16px" data-step="data">Continuar</button>`;
    }
  } else if (ui.step === 'data') {
    body = `<label class="field"><span>Nombre completo</span><input id="f_name" value="${esc(ui.form.name)}" autocomplete="name" maxlength="80"></label>
      <label class="field"><span>Teléfono / WhatsApp</span><input id="f_phone" value="${esc(ui.form.phone)}" inputmode="tel" autocomplete="tel" maxlength="20"></label>
      <label class="field"><span>Dirección de entrega</span><textarea id="f_address" rows="3" maxlength="300" autocomplete="street-address">${esc(ui.form.address)}</textarea></label>
      ${ui.err ? `<div class="err">${esc(ui.err)}</div>` : ''}
      ${summaryHtml(t)}
      <button class="btn" style="margin-top:16px" data-submit ${ui.busy ? 'disabled' : ''}>${ui.busy ? 'Creando pedido…' : 'Confirmar y pagar'}</button>
      <button class="btn ghost" data-step="cart">Volver al carrito</button>`;
  } else if (ui.step === 'pay' && pending) {
    const banks = (settings.bankAccounts || []).filter((b) => b && b.accountNumber);
    body = `<div class="ordno">${esc(pending.orderNumber)}</div>
      <div class="amount">Monto exacto a transferir<b>${fmt(pending.total)}</b></div>
      <div class="step-t">1. Transfiere a una de estas cuentas</div>
      ${banks.length ? banks.map((b) => `<div class="bank">${b.logoUrl ? imgTag(b.logoUrl, 600, b.name) : `<span class="bi">${esc((b.name || '?')[0])}</span>`}
        <div><b>${esc(b.name)}</b> <small>${esc(b.currency || 'C$')} · ${esc(b.holder || '')}</small><code>${esc(b.accountNumber)}</code></div>
        <button class="cp" data-copy="${esc(b.accountNumber)}">Copiar</button></div>`).join('')
        : `<div class="note">Aún no hay cuentas bancarias disponibles. Escríbenos por WhatsApp y te las enviamos.</div>
           <a class="btn ok" style="margin-top:10px;text-decoration:none" target="_blank" rel="noopener" href="${waLink(`Hola, hice el pedido ${pending.orderNumber} por ${fmt(pending.total)} y necesito los datos para pagar.`)}">Pedir cuentas por WhatsApp</a>`}
      <div class="step-t">2. Sube tu comprobante</div>
      <label class="field"><span>Foto o captura de la transferencia</span><input id="f_file" type="file" accept="image/*"></label>
      <label class="field"><span>Número de referencia (opcional)</span><input id="f_ref" value="${esc(ui.ref)}" maxlength="60" inputmode="numeric"></label>
      ${ui.err ? `<div class="err">${esc(ui.err)}</div>` : ''}
      <button class="btn" style="margin-top:16px" data-pay ${ui.busy ? 'disabled' : ''}>${ui.busy ? 'Enviando…' : 'Enviar comprobante'}</button>
      <div class="note">Entrega estimada: 24 a 72 horas después de confirmar tu pago.</div>
      <button class="btn ghost" data-cancel>Cancelar este pedido</button>`;
  } else if (ui.step === 'done') {
    body = `<div class="done"><div class="ck">✓</div><h2>¡Recibimos tu comprobante!</h2>
      <p style="color:var(--ink2);margin-top:8px">Verificaremos tu pago y te escribiremos por WhatsApp para coordinar la entrega.</p>
      <p style="margin-top:12px">Pedido <b>${esc(ui.doneNo)}</b></p>
      <a class="btn ok" style="margin-top:18px;text-decoration:none" target="_blank" rel="noopener" href="${waLink(`Hola, acabo de enviar mi comprobante del pedido ${ui.doneNo}.`)}">Avisar por WhatsApp</a>
      <button class="btn ghost" data-close="dc">Seguir comprando</button></div>`;
  } else { ui.step = 'cart'; return paintCart(); }
  d.innerHTML = `<div class="dh"><span>${STEP_T[ui.step]}</span><button class="x" data-close="dc" aria-label="Cerrar">×</button></div><div class="db">${body}</div>`;
}

function applyCode() {
  const c = ($('#codeIn').value || '').trim().toUpperCase(); ui.code = c;
  if (!c) { ui.applied = null; ui.codeMsg = ''; jdel(K.code); return paintCart(); }
  const f = codes.find((x) => String(x.code).toUpperCase() === c);
  if (!validCode(f)) { ui.applied = null; ui.codeMsg = 'Ese código no es válido o ya venció.'; jdel(K.code); }
  else { ui.applied = f; ui.codeMsg = `Código ${f.code} aplicado.`; jset(K.code, f.code); }
  paintCart();
}

const ORDER_ERR = {
  sold_out: (d) => `"${d.title || 'Un producto'}" ${d.size && d.size !== 'ÚNICA' ? '(' + d.size + ') ' : ''}se agotó. Quítalo del carrito para continuar.`,
  product_unavailable: () => 'Un producto de tu carrito ya no está disponible. Revisa el carrito.',
  invalid_variant: () => 'Una de las opciones elegidas ya no existe. Revisa el carrito.',
  invalid_discount: () => 'El código de descuento ya no es válido. Quítalo e intenta de nuevo.',
  invalid_customer: () => 'Revisa tu nombre, teléfono y dirección.',
};
async function submitOrder() {
  const f = ui.form;
  if (f.name.trim().length < 2 || f.phone.replace(/\D/g, '').length < 7 || f.address.trim().length < 5) {
    ui.err = 'Completa tu nombre, un teléfono válido y tu dirección.'; return paintCart();
  }
  ui.busy = true; ui.err = ''; paintCart();
  try {
    const r = await fetch('/api/order', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: cart.map((c) => ({ id: c.id, selectedSize: c.size })), customer: f, shippingZone: ui.zone, discountCode: ui.applied?.code || null }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || !data.order) { ui.err = (ORDER_ERR[data.error] || (() => 'No pudimos crear el pedido. Revisa tu conexión e intenta de nuevo.'))(data); ui.busy = false; return paintCart(); }
    pending = data.order; jset(K.pend, pending);
    cart = []; saveCart(); ui.applied = null; ui.code = ''; ui.codeMsg = ''; jdel(K.code);
    ui.busy = false; ui.step = 'pay'; paintCart(); showPending();
  } catch { ui.err = 'Sin conexión. Intenta de nuevo.'; ui.busy = false; paintCart(); }
}

// Reduce la foto del comprobante antes de subirla (más rápido en datos móviles)
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((res) => c.toBlob(res, 'image/webp', 0.8));
    return blob ? new File([blob], 'comprobante.webp', { type: 'image/webp' }) : file;
  } catch { return file; }
}
async function sendReceipt() {
  const file = $('#f_file')?.files?.[0]; ui.ref = $('#f_ref')?.value || '';
  if (!file) { ui.err = 'Selecciona la foto de tu comprobante.'; return paintCart(); }
  ui.busy = true; ui.err = ''; paintCart();
  let url;
  try {
    const fd = new FormData(); fd.append('image', await shrink(file));
    const up = await (await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: 'POST', body: fd })).json();
    if (!up.success) throw 0; url = up.data.url;
  } catch { ui.err = 'No pudimos subir la imagen. Intenta de nuevo o envíala por WhatsApp.'; ui.busy = false; return paintCart(); }
  try {
    const r = await fetch('/api/payment', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'pay', orderNumber: pending.orderNumber, token: pending.paymentToken, receiptUrl: url, reference: ui.ref }),
    });
    const d = await r.json().catch(() => ({}));
    if (r.status === 409) { ui.err = 'Este pedido ya no se puede pagar. Haz uno nuevo.'; clearPending(); ui.busy = false; ui.step = 'cart'; return paintCart(); }
    if (!r.ok) throw 0;
    ui.doneNo = pending.orderNumber; clearPending(); ui.busy = false; ui.step = 'done'; paintCart();
  } catch {
    ui.err = 'No se registró el pago. Escríbenos por WhatsApp con tu comprobante.'; ui.busy = false; paintCart();
    $('#dc .err')?.insertAdjacentHTML('afterend', `<a class="btn ok" style="margin-top:10px;text-decoration:none" target="_blank" rel="noopener" href="${waLink(`Hola, pagué el pedido ${pending.orderNumber}. Comprobante: ${url}`)}">Enviar por WhatsApp</a>`);
  }
}
async function cancelOrder() {
  if (!confirm('¿Cancelar este pedido?')) return;
  const o = pending;
  try { await fetch('/api/payment', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'cancel', orderNumber: o.orderNumber, token: o.paymentToken }) }); } catch {}
  // devolver los productos al carrito
  cart = (o.items || []).map((i) => ({ id: i.id, size: i.selectedSize })).filter((c) => byId(c.id)); saveCart();
  clearPending(); ui.step = 'cart'; paintCart();
}
function clearPending() { pending = null; jdel(K.pend); showPending(); }
function showPending() { $('#pending').style.display = pending ? 'block' : 'none'; if (pending) $('#pendNo').textContent = pending.orderNumber; }

/* ============ EVENTOS ============ */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button,a,dialog'); if (!t) return;
  const g = (a) => t.dataset[a];
  if (g('go') === 'catalogo') setTimeout(goCatalog, 0);
  if (t.tagName === 'DIALOG' && e.target === t) { const r = t.getBoundingClientRect(); if (e.clientY < r.top || e.clientY > r.bottom || e.clientX < r.left || e.clientX > r.right) t.close(); return; }
  if (g('open')) openProduct(g('open'));
  else if (g('close')) closeDlg(g('close'));
  else if (g('cat') !== undefined) { cat = g('cat'); history.replaceState(null, '', cat === 'ALL' ? '/' : '?category=' + encodeURIComponent(cat)); renderChips(); renderGrid(); }
  else if (g('size') !== undefined) { pSize = g('size'); paintProduct(byId($('#dp [data-add]').dataset.add)); }
  else if (g('add')) addToCart(g('add'));
  else if (g('dot') !== undefined) { const h = $('#hero'); h.scrollTo({ left: +g('dot') * (h.clientWidth + 12), behavior: 'smooth' }); }
  else if (t.hasAttribute('data-popup')) openPopup();
  else if (g('usecode')) { if (useCode(g('usecode'))) closeDlg('dpop'); }
  else if (g('rm') !== undefined) { cart.splice(+g('rm'), 1); saveCart(); paintCart(); }
  else if (g('zone')) { ui.zone = g('zone'); paintCart(); }
  else if (t.hasAttribute('data-code')) applyCode();
  else if (g('step')) { ui.err = ''; ui.step = g('step'); paintCart(); }
  else if (t.hasAttribute('data-submit')) submitOrder();
  else if (t.hasAttribute('data-pay')) sendReceipt();
  else if (t.hasAttribute('data-cancel')) cancelOrder();
  else if (g('copy')) { navigator.clipboard?.writeText(g('copy')).then(() => toast('Número de cuenta copiado')).catch(() => toast('No se pudo copiar')); }
});
document.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id === 'f_name') ui.form.name = e.target.value;
  else if (id === 'f_phone') ui.form.phone = e.target.value;
  else if (id === 'f_address') ui.form.address = e.target.value;
});
$('#dc').addEventListener('close', syncLock);
$('#dpop').addEventListener('close', syncLock);

/* ============ ARRANQUE ============ */
function init() {
  $('#yr').textContent = new Date().getFullYear();
  $('#waFoot').href = waLink('Hola Kodiashop, quiero más información.');
  saveCart(); showPending();
  $('#openCart').onclick = () => openCart();
  $('#resume').onclick = () => openCart('pay');
  $('#q').addEventListener('input', (e) => { query = e.target.value; renderGrid(); });
  $('#grid').innerHTML = Array.from({ length: 8 }, () => '<div><div class="skel"></div></div>').join('');

  dbg('proyecto Firebase: ' + FB.projectId + ' | WhatsApp: ' + WA);
  firebase.initializeApp(FB); db = firebase.firestore();
  const cp = new URLSearchParams(location.search).get('category'); if (cp) cat = cp;
  const safe = (pr) => pr.catch(() => null);
  Promise.all([
    db.collection('products').get(),
    safe(db.collection('settings').doc('store').get()),
    safe(db.collection('discountCodes').get()),
    safe(db.collection('popupBanners').get()),
  ]).then(([ps, st, cs, bs]) => {
    products = ps.docs.map((d) => ({ id: d.id, ...d.data() }));
    settings = st && st.exists ? st.data() : {};
    codes = cs ? cs.docs.map((d) => d.data()) : [];
    banners = bs ? bs.docs.map((d) => ({ id: d.id, ...d.data() })).filter((x) => x.active && x.image) : [];
    cart = cart.filter((c) => byId(c.id)); saveCart();
    dbg(`productos: ${products.length} | categorías: ${(settings.categories || []).length} | códigos: ${codes.length} | banners: ${banners.length}`);
    restoreCode(); renderAll(); route();
    setTimeout(maybePopup, 700);
  }).catch((e) => {
    const why = String((e && (e.code || e.message)) || '');
    dbg('FALLO AL CARGAR: ' + why);
    $('#grid').innerHTML = `<div class="state" style="grid-column:1/-1">No pudimos cargar los productos.${why ? `<br><small>(${esc(why)})</small>` : ''}<br><button class="btn alt" style="width:auto" onclick="location.reload()">Reintentar</button></div>`;
  });
}
window.addEventListener('DOMContentLoaded', init);
</script>
